name: Contribution snake

on:
  schedule:
    - cron: "23 0 * * *"   # daily, 05:53 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # only to push the generated SVGs to the "output" branch
    steps:
      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#e11d48
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffb020

      - name: Respect reduced motion
        run: |
          for f in dist/github-snake.svg dist/github-snake-dark.svg; do
            grep -q '@keyframes' "$f"
            sed -i 's#</svg>#<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style></svg>#' "$f"
          done

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
