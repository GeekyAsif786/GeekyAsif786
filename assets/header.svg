<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Asifur Rahaman — AI security &amp; safety</title>
<desc id="desc">A dark banner with a terminal prompt and an animated loop: build, break, harden.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0d12"/><stop offset="1" stop-color="#1c1018"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
<linearGradient id="beam" x2="1"><stop stop-color="#ff4d5e" stop-opacity="0"/><stop offset=".5" stop-color="#ff4d5e" stop-opacity=".55"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></linearGradient>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sans{font-family:Segoe UI,Arial,sans-serif}
.flow{stroke-dasharray:6 12;animation:flow 2.6s linear infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
.scan{animation:scan 5s ease-in-out infinite}
.pulse{transform-origin:965px 170px;animation:pulse 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-72}}
@keyframes blink{50%{opacity:0}}
@keyframes scan{0%,100%{transform:translateY(-70px)}50%{transform:translateY(70px)}}
@keyframes pulse{50%{opacity:.25;transform:scale(1.08)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="340" rx="20" fill="url(#bg)"/>
<rect width="1200" height="340" rx="20" fill="url(#grid)"/>
<rect x="42" y="44" width="4" height="252" rx="2" fill="#ff4d5e"/>
<text x="72" y="76" font-size="15" fill="#ffb020">$ whoami<tspan class="cursor" fill="#ffb020"> ▍</tspan></text>
<text class="sans" x="70" y="146" font-size="54" font-weight="700" fill="#f3f4f6">Asifur Rahaman</text>
<text class="sans" x="73" y="192" font-size="23" fill="#d6d9e0">I build ML systems, then try to break them.</text>
<text class="sans" x="73" y="225" font-size="23" fill="#d6d9e0">Working toward safer AI agents.</text>
<text x="73" y="283" font-size="13" letter-spacing="2" fill="#9aa1b0">AI SECURITY  /  ML  /  OFFENSIVE SECURITY</text>
<circle class="pulse" cx="965" cy="170" r="108" fill="none" stroke="#ff4d5e" stroke-opacity=".22"/>
<path d="M800 170H893M1037 170H1122" fill="none" stroke="#ffb020" stroke-width="2" class="flow"/>
<rect x="722" y="144" width="98" height="52" rx="12" fill="#1a1d26" stroke="#3a3f4f"/>
<text x="771" y="175" text-anchor="middle" font-size="14" fill="#d6d9e0">BUILD</text>
<g>
<path d="M965 112l62 22v34c0 38-27 64-62 78c-35-14-62-40-62-78v-34z" fill="#241219" stroke="#ff4d5e"/>
<clipPath id="shield"><path d="M965 112l62 22v34c0 38-27 64-62 78c-35-14-62-40-62-78v-34z"/></clipPath>
<g clip-path="url(#shield)"><rect class="scan" x="900" y="166" width="130" height="10" fill="url(#beam)"/></g>
<text x="965" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#ff8a95">BREAK</text>
<text class="sans" x="965" y="194" text-anchor="middle" font-size="11" fill="#c2c7d1">probe · attack · learn</text>
</g>
<circle cx="1122" cy="170" r="9" fill="#ffb020"/>
<text x="1118" y="211" text-anchor="middle" font-size="12" fill="#d6d9e0">HARDEN</text>
</svg>
